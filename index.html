<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de Estado de Planta</title>
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="jspdf.umd.min.js"></script>
</head><body><main>
<h1>Informe de Estado de Planta</h1>
<label for="fecha" style="margin-top:0">Fecha de emisión</label><input type="date" id="fecha" style="max-width:200px;margin-bottom:14px">

<section class="card">
<h2 id="ftitle">Nuevo desvío</h2>
<label for="sector" style="margin-top:0">Sector</label>
<input id="sector" list="sectores" placeholder="Ej: Depósito" autocomplete="off"><datalist id="sectores"></datalist>
<div class="row"><label class="btn" style="margin:0;color:var(--tx)">📷 Agregar fotos<input type="file" id="fotos" accept="image/*" multiple hidden></label></div>
<div class="thumbs" id="thumbs"></div>
<label for="desc">Descripción del desvío</label>
<textarea id="desc" rows="4" placeholder="Qué se ve, dónde y qué no se cumple"></textarea>
<div class="row"><button class="ia" id="ia-desc" hidden>✨ Mejorar con IA</button><button class="ghost" id="undo-desc" hidden>↩ Deshacer</button></div>
<label for="acc">Acción correctiva propuesta</label>
<textarea id="acc" rows="3" placeholder="1 o 2 acciones"></textarea>
<div class="row"><button class="ia" id="ia-acc" hidden>✨ Mejorar con IA</button><button class="ghost" id="undo-acc" hidden>↩ Deshacer</button></div>
<div class="row" style="margin-top:14px"><button class="primary" id="guardar">Agregar desvío</button><button class="ghost" id="cancelar" hidden>Cancelar edición</button></div>
</section>

<h2>Desvíos de la recorrida (<span id="n">0</span>)</h2>
<div id="lista"></div>
<button class="primary big" id="pdf">Generar PDF</button>
<div class="row"><button class="ghost danger" id="nuevo">Empezar informe nuevo</button></div>
<div id="msg" role="status"></div>
</main>
<script src="config.js"></script><script src="app.js"></script></body></html>
